name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Install dependencies
        run: npm ci
      - name: Verify release
        run: npm run check
      - name: Build release archive
        id: package
        run: echo "file=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.file }}" --verify-tag --generate-notes --title "PatchPulse $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
