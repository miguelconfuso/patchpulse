name: Bug
description: Report incorrect behaviour or a regression
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve PatchPulse.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the observed and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      placeholder: Include commands, scenario, algorithm, and keys used.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 10, Node.js 22, terminal 100×30
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Paste logs or attach screenshots. Do not include sensitive information.
