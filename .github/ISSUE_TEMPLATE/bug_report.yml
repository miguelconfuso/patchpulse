name: Bug
description: Relate um comportamento incorreto ou uma regressão
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Obrigado por ajudar a melhorar o PatchPulse.
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Explique o comportamento observado e o esperado.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir?
      placeholder: Inclua comandos, cenário, algoritmo e teclas utilizadas.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: Windows 10, Node.js 22, terminal 100×30
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências adicionais
      description: Cole logs ou arraste imagens aqui. Não inclua informações sensíveis.
